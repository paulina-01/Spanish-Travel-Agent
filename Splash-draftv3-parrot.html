<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spanish Course — Module Slide Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
</head>
<body>

<div class="page-header">
  <div class="page-title">Beyond the Plaza</div>
  <div class="page-label">Spanish course · Curated guide & workbook for the Modern Traveller</div>
</div>

<div class="switcher" id="switcher"></div>

<div class="slide" id="slide">
  <div class="bg-number" id="bg-num">0</div>

  <!-- LEFT -->
  <div class="panel-left">
    <img class="panel-bg-img" src="https://i.imgur.com/jXbBlFF.jpg" alt="">
    <div>
      <div class="track-pill" id="track">Beginner</div>
      <div class="module-number" id="mod-num">00</div>
      <div class="module-label">Module</div>
      <div class="module-title" id="mod-title">Pronounciation</div>
      <div class="level-badge" id="level">A1</div>
      <div class="step-dots" id="m0-dots" style="display:none">
        <div class="step-dot active" onclick="goStep(0)"></div>
        <div class="step-dot" onclick="goStep(1)"></div>
        <div class="step-dot" onclick="goStep(2)"></div>
        <div class="step-dot" onclick="goStep(3)"></div>
        <div class="step-dot" onclick="goStep(4)"></div>
      </div>
      <div class="step-label" id="m0-step-label" style="display:none">Vowels · 1 of 6</div>
    </div>
    <div class="students-tag">For: <span id="students">All students</span></div>
  </div>

  <!-- RIGHT: standard modules -->
  <div class="panel-right" id="panel-standard">
    <div class="std-view" id="std-content">
      <div class="hook-block">
        <div class="hook-label">The hook</div>
        <div class="hook-text" id="hook"></div>
      </div>
      <div>
        <div class="section-heading">Core concepts</div>
        <div class="concept-list" id="concepts"></div>
      </div>
      <div>
        <div class="section-heading">Key vocabulary</div>
        <div class="vocab-strip" id="vocab"></div>
      </div>
      <div class="sentence-block">
        <div class="sentence-es" id="sent-es"></div>
        <div class="sentence-en" id="sent-en"></div>
      </div>
      <div class="drill-block">
        <div class="drill-label">Practice drill</div>
        <div class="drill-text" id="drill"></div>
      </div>
      <div class="culture-block">
        <div class="culture-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>
        <div class="culture-text"><strong>Culture note — </strong><span id="culture"></span></div>
      </div>
      <div class="step-nav" style="justify-content:flex-end">
        <button class="nav-btn" onclick="showSignup()">Next →</button>
      </div>
    </div>
    <div class="signup-screen" id="std-signup" style="display:none">
      <div class="signup-label">Interested in more?</div>
      <div class="signup-sub">Sign up here</div>
      <div class="signup-row">
        <input class="signup-input" type="email" placeholder="your@email.com" id="signup-email" />
        <button class="nav-btn" style="background:var(--olive);color:var(--white);border-color:var(--olive)" onclick="handleSignup()">Sign up</button>
      </div>
      <div class="signup-thanks" id="signup-thanks">Thanks! We'll be in touch.</div>
    </div>
  </div>

  <!-- RIGHT: M0 multi-step (content injected by js/app.js via fetch) -->
  <div class="panel-right" id="panel-m0" style="display:none"></div>
</div>

<script type="module" src="js/app.js"></script>

<div id="tweaks-root"></div>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#C4614A",
  "panelColor": "#3D4A2E",
  "bodyFont": "DM Sans",
  "showCultureNotes": true,
  "slideMaxWidth": 900
}/*EDITMODE-END*/;

function SpanishTweaks() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    document.documentElement.style.setProperty('--terracotta', tweaks.accentColor);
    document.documentElement.style.setProperty('--terra-light', tweaks.accentColor + 'CC');
    document.documentElement.style.setProperty('--terra-pale', tweaks.accentColor + '22');
  }, [tweaks.accentColor]);

  React.useEffect(() => {
    document.documentElement.style.setProperty('--olive', tweaks.panelColor);
    document.documentElement.style.setProperty('--olive-mid', tweaks.panelColor + 'AA');
  }, [tweaks.panelColor]);

  React.useEffect(() => {
    document.documentElement.style.setProperty('--font-body', "'" + tweaks.bodyFont + "', sans-serif");
  }, [tweaks.bodyFont]);

  React.useEffect(() => {
    document.querySelectorAll('.culture-block').forEach(el => {
      el.style.display = tweaks.showCultureNotes ? '' : 'none';
    });
  }, [tweaks.showCultureNotes]);

  React.useEffect(() => {
    const slide = document.getElementById('slide');
    const switcher = document.getElementById('switcher');
    if (slide) slide.style.maxWidth = tweaks.slideMaxWidth + 'px';
    if (switcher) switcher.style.maxWidth = tweaks.slideMaxWidth + 'px';
  }, [tweaks.slideMaxWidth]);

  return (
    <TweaksPanel>
      <TweakSection title="Colors">
        <TweakColor
          label="Accent (terracotta)"
          value={tweaks.accentColor}
          onChange={v => setTweak('accentColor', v)}
        />
        <TweakColor
          label="Panel (olive)"
          value={tweaks.panelColor}
          onChange={v => setTweak('panelColor', v)}
        />
      </TweakSection>
      <TweakSection title="Typography">
        <TweakSelect
          label="Body font"
          value={tweaks.bodyFont}
          options={['DM Sans','Georgia','Trebuchet MS','Verdana','Palatino Linotype']}
          onChange={v => setTweak('bodyFont', v)}
        />
      </TweakSection>
      <TweakSection title="Layout">
        <TweakSlider
          label="Slide max width"
          value={tweaks.slideMaxWidth}
          min={600} max={1200} step={50}
          onChange={v => setTweak('slideMaxWidth', v)}
        />
      </TweakSection>
      <TweakSection title="Content">
        <TweakToggle
          label="Show culture notes"
          value={tweaks.showCultureNotes}
          onChange={v => setTweak('showCultureNotes', v)}
        />
      </TweakSection>
    </TweaksPanel>
  );
}

ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<SpanishTweaks />);
</script>
</body>
</html>
